syntax = "proto3";

package pile.v1;

option go_package = "github.com/basicallysource/pile/gen/pile/v1;pilev1";

// A collection of sorted pieces, kept as lots (one box, one sort), the
// LEGO sets and custom models the pieces of one or more lots make up, and
// the bins they are kept in.
service PileService {
  // The collection: every lot, with its totals.
  rpc ListLots(ListLotsRequest) returns (ListLotsResponse);
  // A view's lots taken together: their totals, what their pieces are, the
  // sets they complete, nearly complete and most likely came from, the
  // custom models they can build, and the sort-out queue.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // Every set and custom model with a piece in a view's lots.
  rpc ListSets(ListSetsRequest) returns (ListSetsResponse);
  // One set or custom model, line by line, through a view.
  rpc GetSet(GetSetRequest) returns (GetSetResponse);
  // Lots' bulk catalog: every part in every color, with its count in each.
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
  // How long one sorter, fed bulk mixed like the lot, takes to come across
  // every piece of each set: the standard sets and any others asked for.
  rpc GetCollectTimes(GetCollectTimesRequest) returns (GetCollectTimesResponse);
  // The storage: every bin, at its address, and how many pieces it holds.
  rpc GetStorage(GetStorageRequest) returns (GetStorageResponse);
  // Replaces the storage whole, and keeps it.
  rpc SetStorage(SetStorageRequest) returns (SetStorageResponse);
  // What the bins hold that a search and its filters ask for: each part in
  // each color, how many, and which bins they are in.
  rpc FindPieces(FindPiecesRequest) returns (FindPiecesResponse);
  // The starred sets and custom models.
  rpc ListStars(ListStarsRequest) returns (ListStarsResponse);
  // Stars or unstars one, and keeps it.
  rpc SetStar(SetStarRequest) returns (SetStarResponse);
  // Sets, custom models and builds within sets by name or number, as one
  // types: to put one in the sort-out queue.
  rpc FindSets(FindSetsRequest) returns (FindSetsResponse);
  // The catalog's parts by name or number, with how many of each lots have:
  // to pick other parts that make one of a set's part.
  rpc FindParts(FindPartsRequest) returns (FindPartsResponse);
  // What could make one of a set's part instead, through a view: other
  // parts that cover its footprint, the parts the catalog relates to it, and
  // those chosen, each with how many the lots could make.
  rpc GetStandIns(GetStandInsRequest) returns (GetStandInsResponse);
  // Every set's changes: how each will be built where it differs from its
  // inventory.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
  // Makes one change to how a set is built, or takes one back, and keeps it.
  rpc SetChange(SetChangeRequest) returns (SetChangeResponse);
}

// How lots are looked at.
message View {
  // The lots, taken together, in priority order: whatever a set takes is
  // drawn from the first lot that has those pieces, then the next.
  repeated string lots = 1;
  reserved 2;
  reserved "any_color";
  // Sets and custom models to sort out, most wanted first. Each takes its
  // pieces from what the ones before it left; everything else is matched
  // against what is left after all of them.
  repeated string sort_out = 3;
  // Which sets and custom models are listed.
  Filter filter = 4;
  // Which kinds of part count toward a set's completeness. Unset:
  // accessories count, printed parts and minifigure parts do not.
  Counting counting = 5;
  // Which colors a set's line takes once its own color runs out.
  ColorMatch colors = 6;
  // Changes to sets are kept with the sets (Change), not in a view.
  reserved 7;
  reserved "color_choices";
}

// Which colors a set's line takes once its own color runs out. A piece in
// another color counts as found, and each set says how many of its pieces
// are.
enum ColorMatch {
  // Exact.
  COLOR_MATCH_UNSPECIFIED = 0;
  // None: a line needs its part in its color.
  COLOR_MATCH_EXACT = 1;
  // The colors near its own: shades of one color, old and new grays.
  COLOR_MATCH_SIMILAR = 2;
  // Any color of its part.
  COLOR_MATCH_ANY = 3;
}

// A change to how a set will be built where it differs from its inventory,
// kept with the set in pile's data folder and counted wherever the set is
// matched (its panel, the sort-out queue, the overview) in every view. It is
// for one line (a part in a color, as the set has them) or, for its colors
// only, every line in a color; a line's own change of colors is made after
// its color's.
message Change {
  // The set's part (Rebrickable's number); empty for every line in `color`.
  string part_num = 1;
  // The color as the set has it.
  int32 color = 2;
  oneof what {
    // The colors it takes instead of its own.
    ColorTake colors = 3;
    // Other parts that make one of it once its own part runs out.
    PartSwap swap = 4;
    // Counted toward the set's completeness, or left out, whatever the
    // view counts.
    bool counted = 5;
  }
  // Read only: the change in words, part numbers and color names
  // ("60470b Yellow: or 2 x 4085 Yellow").
  string text = 6;
}

// Which colors a line takes instead of its own: one other color, several to
// fill it from in any mix (the first counts as its color, the rest as
// another color), or any color of its part. None is its own color, which
// undoes its color's change for one part.
message ColorTake {
  repeated int32 colors = 1;
  bool any = 2;
}

// Other parts that make one of a line's part, each tried in turn once its
// own part (in every color it takes) runs out, in the colors the line takes.
message PartSwap {
  repeated StandIn stand_ins = 1;
}

// What makes one of a part: so many of each of some other parts, or (fits)
// any combination of plates, tiles or bricks of its kind and height that
// covers its footprint, which matching picks from what the lots have.
message StandIn {
  repeated PartQuantity parts = 1;
  bool fits = 2;
}

message PartQuantity {
  string part_num = 1;
  int32 quantity = 2;
}

// A set's changes, in the order they were made.
message SetChanges {
  string set_num = 1;
  repeated Change changes = 2;
}

// A color, and how many pieces of something are in it.
message ColorCount {
  Color color = 1;
  int32 pieces = 2;
}

// Which kinds of part count toward a set's completeness, a plain part
// always. A part that does not count is still found, and sorted out with its
// set.
message Counting {
  // Printed parts and stickers.
  bool printed = 1;
  // Minifigure body parts: heads, torsos and arms, legs, hair and hats.
  bool figure_parts = 2;
  // What Rebrickable files under minifig accessories and shields, weapons
  // and tools: taps, cups, life rings, wrenches.
  bool accessories = 3;
}

// Which sets and custom models a view lists; the rest are hidden, except
// those in the sort-out queue.
message Filter {
  // Hide sets of loose bricks: buckets, brick boxes, service packs.
  bool hide_loose_bricks = 1;
  // Hide basic sets: almost all plain bricks, plates, tiles and slopes.
  bool hide_mostly_basic = 2;
  // Hide sets of ten or fewer different parts.
  bool hide_few_parts = 3;
  // Hide sets with nothing unusual: their rarest pieces as common as those
  // of the most common tenth of sets.
  bool hide_nothing_unusual = 4;
  // KIND_UNSPECIFIED is every kind.
  Kind kind = 5;
  // Only this theme group; empty for every theme.
  string theme_group = 6;
  bool licensed_only = 7;
  // Only those of at least this many counted pieces.
  int32 min_pieces = 8;
  // Only the starred ones.
  bool starred_only = 9;
}

// Why a filter hides a set.
enum Rule {
  RULE_UNSPECIFIED = 0;
  RULE_LOOSE_BRICKS = 1;
  RULE_MOSTLY_BASIC = 2;
  RULE_FEW_PARTS = 3;
  RULE_NOTHING_UNUSUAL = 4;
  RULE_KIND = 5;
  RULE_THEME = 6;
  RULE_LICENSED = 7;
  RULE_SIZE = 8;
  RULE_NOT_STARRED = 9;
}

message Color {
  // Rebrickable's color id.
  int32 id = 1;
  string name = 2;
  // Hex without the #.
  string rgb = 3;
  bool transparent = 4;
  int32 bricklink_id = 5;
}

// Pieces taken together: one lot's, or a view's lots'.
message Totals {
  // Pieces the sorters classified.
  int32 pieces = 1;
  // Distinct part and color pairs among them.
  int32 part_colors = 2;
  // Pieces whose part or color has no Rebrickable match.
  int32 unmatched_pieces = 3;
  int64 first_seen_unix = 4;
  int64 last_seen_unix = 5;
  // The sorters they came from, when there are three or fewer.
  string machine_name = 6;
  // Their colors by share of the pieces, most first.
  repeated ColorShare colors = 7;
  // Who gave the pieces their colors, most pieces first.
  repeated ColorSource color_sources = 8;
}

// Some pieces' colors, and who gave them.
message ColorSource {
  // A model's name for a model run over the pieces' pictures after they
  // were sorted; "a person" for corrections; empty for the sorter's own
  // classifier while it sorted.
  string by = 1;
  int32 pieces = 2;
}

message Lot {
  string id = 1;
  string name = 2;
  // One sentence: where the pieces came from.
  string description = 3;
  // When the machine's records were copied.
  int64 snapshot_unix = 4;
  // Left off the collection page: it is added to a view from its lots.
  bool unlisted = 5;
  Totals totals = 6;
}

// Some pieces of something, in one lot.
message LotCount {
  string lot_id = 1;
  int32 pieces = 2;
}

message ColorShare {
  Color color = 1;
  int32 pieces = 2;
}

message CategoryShare {
  string name = 1;
  int32 pieces = 2;
}

message ListLotsRequest {}

message ListLotsResponse {
  repeated Lot lots = 1;
  // When the Rebrickable catalog was downloaded.
  int64 catalog_unix = 2;
  // Sets, custom models and builds within sets every lot is matched
  // against.
  int32 sets_checked = 3;
  int32 custom_models_checked = 4;
  int32 builds_checked = 5;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  // A set LEGO sold.
  KIND_SET = 1;
  // A free custom model (MOC): on Rebrickable, or in a designer's
  // collection.
  KIND_CUSTOM = 2;
  // One build within a set LEGO sold (a building, a vehicle), from a 3D
  // model of the set.
  KIND_BUILD = 3;
}

// A set or custom model against the pieces a view leaves.
message SetMatch {
  string set_num = 1;
  string name = 2;
  int32 year = 3;
  string theme = 4;
  string image_url = 5;
  // Pieces of it found, each line capped at what it needs.
  int32 have = 6;
  // Pieces in it, not counting printed parts, stickers, minifigures or
  // minifigure parts.
  int32 need = 7;
  // The same, weighted by how rare each part (and color) is across all sets:
  // finding its unusual pieces counts for more than its 2x4 bricks.
  double weighted_completeness = 8;
  // How much distinctive evidence the pieces hold for it.
  double evidence = 9;
  // Printed parts and stickers, left out of `need`.
  int32 printed_parts = 10;
  int32 minifigures = 11;
  // Other sets with exactly the same pieces (the same box sold under several numbers).
  repeated string same_contents = 12;
  // Its place in the likely order (judged in exact colors), from 1; 0 when
  // it is not among them.
  int32 pick = 13;
  // Loose minifigure parts, left out of `need`.
  int32 minifigure_parts = 14;
  // Basically a minifigure: its figures (about four pieces each) and loose
  // figure parts outweigh its counted pieces.
  bool minifigure_set = 15;
  Kind kind = 16;
  // A custom model's designer.
  string designer = 17;
  // Its page on Rebrickable.
  string url = 18;
  // In an any-color view, the pieces of `have` that are another color.
  int32 wrong_color = 19;
  // The theme at the top of its theme's tree ("Star Wars").
  string theme_group = 20;
  // Made under license (Star Wars, Marvel, Minecraft...).
  bool licensed = 21;
  // Loose bricks rather than a model: a bucket, a brick box, a service pack.
  bool bulk = 22;
  // How many different parts it has.
  int32 distinct_parts = 23;
  // How rare its pieces are on average across all sets: high for a model of
  // something, low for a box of common bricks.
  double rarity = 24;
  // The filter's rules for basic sets that it fits.
  bool mostly_basic = 25;
  bool few_parts = 26;
  bool nothing_unusual = 27;
  // Minifigure accessories in it.
  int32 accessories = 28;
  // A build's set, and how many of the build it has.
  string of_set_num = 29;
  string of_name = 30;
  int32 copies = 31;
  // The designer's collection a custom model is in; empty for one from
  // Rebrickable.
  string collection = 32;
  // The file its parts were read from when they are not Rebrickable's (a 3D
  // model of its set, a digital copy of a designer's model): who made it,
  // its page, and what it says it lacks.
  string source_author = 33;
  string source_url = 34;
  string source_notes = 35;
}

// The first sets of a section, and how many it has.
message Section {
  repeated SetMatch sets = 1;
  int32 total = 2;
}

message GetOverviewRequest {
  View view = 1;
}

// A set in the sort-out queue, and the lots its pieces are drawn from.
message QueuedSet {
  SetMatch set = 1;
  // In the view's order; a lot it draws nothing from is left out.
  repeated LotCount lots = 2;
}

message GetOverviewResponse {
  // The view's lots, in its order.
  repeated Lot lots = 1;
  // Theirs together.
  Totals totals = 2;
  // The parts' categories by share of the pieces, most first.
  repeated CategoryShare categories = 3;
  // The sort-out queue in order, each against what the ones before it left.
  repeated QueuedSet sort_out = 4;
  // Pieces left once the queue has taken its pieces.
  int32 pieces_left = 5;
  // Every counted piece is there. Most interesting first.
  Section complete = 6;
  // At least 80% there and not complete. Most interesting first.
  Section almost = 7;
  // Sets of at least 50 counted pieces with half or more there, under
  // almost and not likely. Most pieces found first.
  Section half = 8;
  // The sets the pieces most likely came from (judged in exact colors) that
  // are neither complete nor almost, most likely first.
  Section likely = 9;
  // Free custom models at least 60% there, most complete first.
  Section custom = 10;
  // Sets that are basically a minifigure, complete, almost or likely.
  Section minifigure = 11;
  // Complete sets of under five counted pieces (key chains, gear).
  Section tiny = 12;
  // The theme groups of the sets the rest of the filter lets through, most
  // first.
  repeated ThemeCount themes = 13;
  // Every starred set and custom model with a piece left in the lots,
  // whatever the filter, most recently starred first.
  Section starred = 14;
  // Builds within sets at least 60% there whose set is not complete, most
  // complete first.
  Section builds = 15;
  // Each designer's collection: every model of it with a piece there, most
  // complete first.
  repeated CollectionSection collections = 16;
}

message CollectionSection {
  string name = 1;
  string designer = 2;
  Section section = 3;
}

// Which of the overview's sections a set is in.
enum Place {
  // In none of them.
  PLACE_NONE = 0;
  PLACE_COMPLETE = 1;
  PLACE_ALMOST = 2;
  PLACE_HALF = 3;
  PLACE_LIKELY = 4;
  PLACE_CUSTOM = 5;
  PLACE_MINIFIGURE = 6;
  PLACE_TINY = 7;
  // In the sort-out queue, which shows above them.
  PLACE_SORT_OUT = 8;
  // The view's filter hides it.
  PLACE_HIDDEN = 9;
  PLACE_BUILD = 10;
  // Its designer's collection.
  PLACE_COLLECTION = 11;
}

enum Order {
  ORDER_UNSPECIFIED = 0;
  // Most of it found first.
  ORDER_COMPLETE = 1;
  // Most pieces found first.
  ORDER_FOUND = 2;
  // Most interesting first: big, with rare pieces, and much of it found
  // (its rarity-weighted pieces found times its weighted completeness
  // squared).
  ORDER_INTERESTING = 3;
  // Most pieces first.
  ORDER_BIGGEST = 4;
  // Most different parts first.
  ORDER_COMPLEX = 5;
}

message ListSetsRequest {
  View view = 1;
  Order order = 2;
}

message ThemeCount {
  string name = 1;
  int32 sets = 2;
}

message ListSetsResponse {
  repeated SetMatch sets = 1;
  // The theme groups of the sets the rest of the filter lets through, most
  // first.
  repeated ThemeCount themes = 2;
}

message GetSetRequest {
  View view = 1;
  string set_num = 2;
}

// What kind of part a set's line is, for what counts toward completeness.
enum PartClass {
  PART_CLASS_UNSPECIFIED = 0;
  PART_CLASS_PLAIN = 1;
  // A printed part or a sticker.
  PART_CLASS_PRINTED = 2;
  // A minifigure body part: a head, torso or arm, legs, hair or a hat.
  PART_CLASS_FIGURE = 3;
  // A minifigure accessory, shield, weapon or tool: a tap, a cup, a wrench.
  PART_CLASS_ACCESSORY = 4;
}

message SetLine {
  string part_num = 1;
  string name = 2;
  Color color = 3;
  int32 need = 4;
  // Pieces of this part (or a mold variant) found for this line, up to `need`:
  // in its color, or in the other colors it takes (View.colors, the set's
  // ColorTake), or made from other parts (the set's PartSwap). Counted or
  // not.
  int32 found = 5;
  // Of `found`, the pieces in another color.
  int32 wrong_color = 6;
  string image_url = 7;
  PartClass class = 8;
  // The lots the pieces `found` takes are drawn from, in the view's order
  // (other parts' pieces included).
  repeated LotCount lots = 9;
  // Whether it counts toward the set's completeness: as the view counts
  // its class, or as the set's change says.
  bool counted = 10;
  reserved 11;
  reserved "use_color";
  // The colors it takes instead of its own (its ColorTake, or its color's):
  // one, or several to mix; or any color.
  repeated Color use_colors = 14;
  bool any_color = 12;
  // Its part in every color the lots have, most first.
  repeated ColorCount part_colors = 13;
  // Of `found`, how many are made from other parts (its PartSwap), and the
  // pieces of those parts they take.
  int32 made = 15;
  repeated PartCount made_from = 16;
  // A plate, tile or brick of whole studs, which smaller ones of its kind
  // can cover.
  bool has_footprint = 17;
}

// One of a set's colors, and what could stand in for it.
message SetColor {
  Color color = 1;
  // Its pieces in the set, and of those, found (in the colors the view
  // takes).
  int32 need = 2;
  int32 found = 3;
  // The set's change for the color: the colors it takes instead, or any.
  reserved 4;
  reserved "use_color";
  repeated Color use_colors = 7;
  bool any_color = 5;
  // Other colors, each with how many of this color's pieces the lots have
  // in it, part by part (each line capped at what it needs): what taking it
  // instead would find. The most first.
  repeated ColorCount swaps = 6;
}

message Minifigure {
  string fig_num = 1;
  string name = 2;
  int32 quantity = 3;
  string image_url = 4;
}

message GetSetResponse {
  SetMatch set = 1;
  repeated SetLine lines = 2;
  repeated Minifigure minifigures = 3;
  // Where the overview shows it in this view.
  Place place = 4;
  // The same set in the other color matching (any color when the view is
  // exact or similar, exact when it is any), and where the overview shows
  // it then: so a page can say why a set is or is not listed.
  SetMatch other_colors = 5;
  Place other_place = 6;
  // The filter's rules that hide it (with PLACE_HIDDEN).
  repeated Rule hidden_by = 7;
  // A sold set's builds, each against what the view leaves, in its 3D
  // model's order.
  repeated SetMatch builds = 8;
  // Of the file its parts were read from (see SetMatch.source_author): for
  // a sold set's 3D model, the set's pieces its builds hold; for a model's
  // file, the pieces read. And the file's parts no catalog part stands for,
  // left out.
  int32 source_placed = 9;
  repeated string source_unplaced = 10;
  // Its colors, the most pieces first.
  repeated SetColor colors = 11;
  // Its changes, in the order they were made.
  repeated Change changes = 12;
}

message ListPartsRequest {
  // Taken together, in a view's order.
  repeated string lots = 1;
}

// A part in a color, and how many the lots have.
message PartCount {
  string part_num = 1;
  string bricklink_id = 2;
  string name = 3;
  Color color = 4;
  int32 count = 5;
  string image_url = 6;
  string category = 7;
  // The classifier's mean confidence over these pieces, 0 to 1.
  float mean_confidence = 8;
  // How many each lot has, in the request's order; a lot with none is left out.
  repeated LotCount lots = 9;
}

// Pieces the catalog cannot place: the classifier's own names.
message UnmatchedPart {
  string bricklink_id = 1;
  string name = 2;
  string color_name = 3;
  int32 count = 4;
}

message ListPartsResponse {
  repeated PartCount parts = 1;
  repeated UnmatchedPart unmatched = 2;
}

message GetCollectTimesRequest {
  string lot_id = 1;
  // Sets to time besides the standard ones.
  repeated string extra = 2;
}

// What a lot's times rest on.
message CollectBasis {
  // Classified pieces, the mix the times assume.
  int32 pieces = 1;
  // The sorters they came from, when there are three or fewer.
  string machine_name = 2;
  // Hours the sorters spent sorting (a gap of a minute or less between two
  // pieces counts), and the classified pieces an hour that turns into time.
  double sorting_hours = 3;
  double rate_per_hour = 4;
  int64 first_seen_unix = 5;
  int64 last_seen_unix = 6;
  // When the records were pulled or copied.
  int64 snapshot_unix = 7;
}

// One piece that holds a set up.
message SlowPiece {
  string part_num = 1;
  string name = 2;
  // Unset in any-color mode.
  Color color = 3;
  int32 need = 4;
  // Pieces of it in the lot.
  int32 seen = 5;
  // Hours of sorting before its count is expected.
  double wait_hours = 6;
  string image_url = 7;
}

// A set's times in one color mode, in hours of sorting on one machine running
// nonstop; -1 is never.
message CollectTime {
  // Expected share of its pieces found: half, nine in ten, 99 in 100.
  double half = 1;
  double most = 2;
  double nearly = 3;
  // Every piece: the median, and one run in ten faster or slower.
  double all = 4;
  double all_fast = 5;
  double all_slow = 6;
  // The 5th to 95th percentile of `most` and `all` over resamplings of the
  // lot's machine-days: how much they hang on which bulk came in.
  double most_low = 7;
  double most_high = 8;
  double all_low = 9;
  double all_high = 10;
  // Every part-color the lot has had a piece of: a floor from data alone.
  double all_seen = 11;
  // Every piece, were the part-colors never seen ten times rarer.
  double all_rarer = 12;
  // Its part-colors, and the ones (and their pieces) the lot never had.
  int32 keys = 13;
  int32 unseen_keys = 14;
  int32 unseen_pieces = 15;
  // The pieces that hold it up the longest, longest first.
  repeated SlowPiece slowest = 16;
}

message SetCollectTimes {
  string set_num = 1;
  string name = 2;
  int32 year = 3;
  string theme = 4;
  string image_url = 5;
  // Pieces counted, and the ones left out by reason (printed or sticker,
  // minifigure part, specialty mold, too big for a sorter...).
  int32 pieces = 6;
  map<string, int32> left_out = 7;
  int32 minifigures = 8;
  CollectTime exact = 9;
  CollectTime near = 10;
  CollectTime any = 11;
  // Not worked out yet; it is on its way.
  bool pending = 12;
  // Asked for, and the catalog has no such set with counted pieces.
  bool unknown = 13;
}

message GetCollectTimesResponse {
  CollectBasis basis = 1;
  repeated SetCollectTimes sets = 2;
  // When the lot's model was fitted (the server works it out at start, from
  // the data it loaded); 0 while it is being fitted.
  int64 fitted_unix = 3;
}

// A place pieces are kept, and what it holds: one lot's pieces of some of the
// sorter's categories (a sorter's bin emptied into it), or the lot's pieces
// no other bin of it holds.
message StorageBin {
  // Where it is, as it is labelled ("3D-04").
  string address = 1;
  // What it holds, in words.
  string name = 2;
  string lot_id = 3;
  // The sorter's categories whose pieces it holds (its profile's ids for
  // them); none for the rest of the lot.
  repeated string categories = 4;
  // Pieces in it. Read only.
  int32 pieces = 5;
}

message GetStorageRequest {}

message GetStorageResponse {
  repeated StorageBin bins = 1;
}

message SetStorageRequest {
  // Every bin. Each has an address no other has and an existing lot, and
  // no lot's category (or the rest of a lot) is in two bins.
  repeated StorageBin bins = 1;
}

message SetStorageResponse {
  repeated StorageBin bins = 1;
}

message FindPiecesRequest {
  // Words that each start a word of the part's name or number, its color, its
  // type, or the bin's address, in any order (a bin's name is the bin
  // filter's). Empty finds everything.
  string query = 1;
  // Only this color, by name; empty for any.
  string color = 2;
  // Only this type of part (the catalog's part category); empty for any.
  string type = 3;
  // Only bins of this name; empty for any.
  string bin = 4;
  // Only this lot's bins; empty for any.
  string lot_id = 5;
  // At most this many parts in a color; 0 for 200.
  int32 limit = 6;
}

// Some of a part in a color, in one bin.
message BinCount {
  string address = 1;
  string name = 2;
  string lot_id = 3;
  int32 count = 4;
}

// A part in a color the bins hold.
message StoredPart {
  string part_num = 1;
  string bricklink_id = 2;
  string name = 3;
  Color color = 4;
  string type = 5;
  string image_url = 6;
  // In every bin it is in.
  int32 count = 7;
  // Most first.
  repeated BinCount bins = 8;
}

// One choice of a filter, and the pieces it would find with the other
// filters and the search as they are.
message FilterOption {
  string value = 1;
  // What to show for it, when not the value itself (a lot's name).
  string label = 2;
  int32 pieces = 3;
  // For a color.
  Color color = 4;
}

message FindPiecesResponse {
  // Exact word matches first, then most pieces first.
  repeated StoredPart parts = 1;
  // All the parts in a color found, and their pieces, past the limit too.
  int32 total_parts = 2;
  int32 total_pieces = 3;
  // Pieces in all the bins.
  int32 stored_pieces = 4;
  // Each filter's choices, most pieces first.
  repeated FilterOption colors = 5;
  repeated FilterOption types = 6;
  repeated FilterOption bins = 7;
  repeated FilterOption lots = 8;
}

message ListStarsRequest {}

message ListStarsResponse {
  // Most recently starred first.
  repeated string set_nums = 1;
}

message SetStarRequest {
  string set_num = 1;
  bool starred = 2;
}

message SetStarResponse {
  // Every star after the change, most recent first.
  repeated string set_nums = 1;
}

message FindSetsRequest {
  // Words that each start a word of its name or number, or a build's set's,
  // in any order.
  string query = 1;
  // At most this many; 0 for 20.
  int32 limit = 2;
}

// A set, custom model or build within a set, as a search finds it.
message FoundSet {
  string set_num = 1;
  string name = 2;
  Kind kind = 3;
  int32 year = 4;
  string theme = 5;
  string image_url = 6;
  // A build's set.
  string of_set_num = 7;
  string of_name = 8;
  // A custom model's designer, and its collection.
  string designer = 9;
  string collection = 10;
  // Its pieces, counting what a view counts by default.
  int32 pieces = 11;
}

message FindSetsResponse {
  // Its number first, then whole words before beginnings of words; sets
  // LEGO sold, then builds, then custom models; the biggest first.
  repeated FoundSet sets = 1;
}

message FindPartsRequest {
  // Words that each start a word of the part's name or number.
  string query = 1;
  // The lots whose pieces are counted, taken together.
  repeated string lots = 2;
  // Count only these colors; none for every color.
  repeated int32 colors = 3;
  // At most this many; 0 for 30.
  int32 limit = 4;
}

message FindPartsResponse {
  // Its number first, then whole words; the most pieces first. Each
  // PartCount has no color: `count` is in the colors asked for.
  repeated PartCount parts = 1;
}

message GetStandInsRequest {
  View view = 1;
  string set_num = 2;
  // The line, as the set has it.
  string part_num = 3;
  int32 color = 4;
}

// Where a stand-in comes from.
enum StandInSource {
  STAND_IN_SOURCE_UNSPECIFIED = 0;
  // Smaller plates, tiles or bricks of its kind and height that cover its
  // footprint.
  STAND_IN_SOURCE_FOOTPRINT = 1;
  // The part it is a print or pattern of.
  STAND_IN_SOURCE_UNPRINTED = 2;
  // A print or pattern of it.
  STAND_IN_SOURCE_PRINTED = 3;
  // The parts it is assembled from, one of each.
  STAND_IN_SOURCE_SUB_PARTS = 4;
  // Picked by hand.
  STAND_IN_SOURCE_PICKED = 5;
}

// A part of a stand-in: how many of it make one, and how many pieces of it
// the lots have.
message StandInPart {
  string part_num = 1;
  string name = 2;
  string image_url = 3;
  int32 quantity = 4;
  int32 pieces = 5;
}

// One way to make one of a line's part, and how many the lots could make.
message StandInOption {
  StandIn stand_in = 1;
  StandInSource source = 2;
  // Its parts (none for any that fit), each with how many pieces the lots
  // have in the colors the line takes, of what the sets before it in the
  // queue and the set itself leave (the set without this line's
  // stand-ins).
  repeated StandInPart parts = 3;
  // How many of the line's part (up to what it needs) the lots could make
  // from it, of the same.
  int32 makes = 4;
  // The line takes it (its PartSwap has it).
  bool chosen = 5;
}

message GetStandInsResponse {
  // Any combination of smaller plates, tiles or bricks of its kind and
  // height that covers its footprint, when it is a plain one.
  StandInOption fits = 1;
  // Every other way: those chosen first, in the line's order, then the
  // most it could make first, and the fewest pieces; those the lots could
  // make none of are left out but for those chosen.
  repeated StandInOption options = 2;
}

message ListChangesRequest {}

message ListChangesResponse {
  // Every set with a change, by set number.
  repeated SetChanges sets = 1;
}

message SetChangeRequest {
  string set_num = 1;
  // Replaces the set's change of the same line and kind, if any.
  Change change = 2;
  // Takes back the set's change of that line and kind instead.
  bool undo = 3;
}

message SetChangeResponse {
  // The set's changes after it.
  SetChanges set = 1;
}
